name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project
        run: |
          flutter create --org com.theholynation --project-name the_holy_nation .
          git checkout HEAD -- lib pubspec.yaml || true

      - name: Build Real Bible Database
        run: python3 build_db.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew assembleRelease -x lintVitalAnalyzeRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
