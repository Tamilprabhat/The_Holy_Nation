name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Adaptive Icon with Safe Zone Padding
        run: |
          pip install pillow
          python3 -c '
          from PIL import Image
          img = Image.open("assets/icon/app_icon.png").convert("RGBA")
          canvas_size = 1024
          bg = Image.new("RGBA", (canvas_size, canvas_size), (13, 71, 161, 255))
          inner_size = int(canvas_size * 0.68)
          img_resized = img.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
          offset = (canvas_size - inner_size) // 2
          bg.paste(img_resized, (offset, offset), img_resized)
          bg.save("assets/icon/app_icon_padded.png")
          '

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
