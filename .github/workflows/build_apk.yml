name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Multi-Language Offline Bible DB
        run: python build_db.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Project Files
        run: |
          flutter create --platforms=android .
          python -c '
          p = "android/app/src/main/AndroidManifest.xml"
          with open(p, "r") as f:
              s = f.read()
          perm = "<uses-permission android:name=\"android.permission.INTERNET\"/>"
          if perm not in s:
              s = s.replace("<application", perm + "\n    <application", 1)
              with open(p, "w") as f:
                  f.write(s)
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Adaptive Icon with Safe Zone Padding
        run: |
          pip install pillow
          python -c '
          from PIL import Image
          img = Image.open("assets/icon/app_icon.png").convert("RGBA")
          canvas_size = 1024
          bg = Image.new("RGBA", (canvas_size, canvas_size), (13, 71, 161, 255))
          inner_size = int(canvas_size * 0.65)
          img_resized = img.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
          offset = (canvas_size - inner_size) // 2
          bg.paste(img_resized, (offset, offset), img_resized)
          bg.save("assets/icon/app_icon_padded.png")
          '

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons -f pubspec.yaml

      - name: Build APK
        run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
